name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: PHPUnit (PHP ${{ matrix.php }}, Postgres 16)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.3 matches the production image (see Dockerfile).
        php: ['8.3']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: menro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # phpunit.xml pins the connection and database name; the rest has to come
      # from here because there is no .env in CI. PHPUnit's <env> entries do not
      # overwrite variables that are already set, so these win where they overlap.
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: menro_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # Mirrors the extensions the Docker image installs.
          extensions: pdo, pdo_pgsql, zip, gd, intl, bcmath, mbstring
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build frontend assets
        # public/build is gitignored, so a fresh checkout has no Vite manifest
        # and every page rendering @vite would fail.
        run: |
          npm ci
          npm run build

      - name: Prepare the application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrate and seed the test database
        # The suite uses DatabaseTransactions rather than RefreshDatabase, so it
        # expects the schema and the core seed data to already be present.
        run: php artisan migrate --seed --force

      - name: Run tests
        run: php artisan test
