services:
  - type: web
    name: menro
    env: docker
    plan: free
    branch: main
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: MENRO
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://menro.onrender.com   # change to your actual URL
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false   # set in Render dashboard — your external MySQL host
      - key: DB_PORT
        value: 3306
      - key: DB_DATABASE
        sync: false   # set in Render dashboard
      - key: DB_USERNAME
        sync: false   # set in Render dashboard
      - key: DB_PASSWORD
        sync: false   # set in Render dashboard
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
