; Livewire's temporary-upload rule is max:10240 (10 MB, config/livewire.php).
; PHP has to allow MORE than that, or a 10 MB file arrives truncated instead of
; failing validation cleanly.
upload_max_filesize = 12M
post_max_size = 16M

; ReportController builds .xlsx in-request via PhpSpreadsheet and dompdf renders
; the PDF; both are memory-hungry over a year of waste entries.
memory_limit = 512M
max_execution_time = 120

; The code is immutable inside the image, so never stat the filesystem.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

expose_php = Off
